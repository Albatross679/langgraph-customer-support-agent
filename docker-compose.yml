services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_copilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: .
    command: python -m support_copilot.bootstrap
    environment: &app_environment
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_copilot
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      RESET_DEMO_DATA: ${RESET_DEMO_DATA:-0}
      DAILY_RUN_LIMIT: ${DAILY_RUN_LIMIT:-50}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn support_copilot.api:app --host 0.0.0.0 --port 8000
    environment: *app_environment
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: .
    command: arq support_copilot.worker.WorkerSettings
    environment: *app_environment
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
