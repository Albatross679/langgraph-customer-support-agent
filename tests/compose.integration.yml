# Must be used with an isolated -p name, never the demo Compose project.
services:
  postgres:
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:-15482}:5432"]
  redis:
    ports: ["127.0.0.1:${TEST_REDIS_PORT:-16382}:6379"]
  fixture-provider:
    ports: ["127.0.0.1:${TEST_PROVIDER_PORT:-18083}:8080"]
    build: .
    volumes: ["./tests:/app/tests:ro"]
    command: uvicorn tests.fixture_provider:app --host 0.0.0.0 --port 8080
  init:
    environment:
      OPENROUTER_API_KEY: synthetic-not-a-secret
      OPENROUTER_BASE_URL: http://fixture-provider:8080
      DAILY_RUN_LIMIT: 0
    depends_on:
      fixture-provider:
        condition: service_started
  api:
    ports: !override ["127.0.0.1:${TEST_API_PORT:-18082}:8000"]
    environment:
      DAILY_RUN_LIMIT: 0
  worker:
    command: arq scripts.evaluation_worker.WorkerSettings
    environment:
      OPENROUTER_API_KEY: synthetic-not-a-secret
      OPENROUTER_BASE_URL: http://fixture-provider:8080
