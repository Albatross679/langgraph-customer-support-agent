name: Approved EC2 promotion

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full merged main commit SHA to build and promote
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require configured production approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/environments/production > /tmp/environment.json
          python -c 'import json; d=json.load(open("/tmp/environment.json")); assert any(r["type"] == "required_reviewers" and r.get("reviewers") for r in d["protection_rules"]), "Production required reviewers are missing"; assert (d.get("deployment_branch_policy") or {}).get("custom_branch_policies"), "Explicit main-only deployment policy is missing"'
          gh api repos/${{ github.repository }}/environments/production/deployment-branch-policies > /tmp/branches.json
          python -c 'import json; d=json.load(open("/tmp/branches.json")); assert [(p["name"], p.get("type", "branch")) for p in d["branch_policies"]] == [("main", "branch")], "Production must permit only main"'
      - name: Require a merged immutable revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          git checkout --detach "$REVISION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install . --group dev
      - run: ruff check . && pytest -m 'not integration and not eval'
      - run: cd web && npm ci && npm test && npm run build
      - name: Isolated secret-free real-stack regression
        env:
          API_PORT: '18082'
          OPENROUTER_API_KEY: ''
        run: |
          docker compose -p support-gap-ci -f docker-compose.yml -f tests/compose.integration.yml up -d --build
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18082/ready
          RUN_ISOLATED_INTEGRATION=1 pytest tests/test_refund_durability.py tests/test_refund_proposal_binding.py tests/test_legacy_action_projection.py
      - name: Remove isolated stack
        if: always()
        run: docker compose -p support-gap-ci -f docker-compose.yml -f tests/compose.integration.yml down -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/albatross679/langgraph-customer-support-agent:sha-${{ inputs.revision }}
          labels: org.opencontainers.image.revision=${{ inputs.revision }}
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/albatross679/langgraph-customer-support-agent@$DIGEST" >> "$GITHUB_OUTPUT"

  promote:
    needs: gates
    runs-on: ubuntu-latest
    # Configure required reviewers and main-only deployment in this EXISTING repo environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Pin existing host and use existing deployment key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Promote digest with health validation and rollback
        env:
          IMAGE: ${{ needs.gates.outputs.image }}
        run: |
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/ec2 deploy/ec2/promote.sh deploy/ec2/compose.image.yml ubuntu@18.219.217.47:/opt/portfolio-support-copilot/
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/ec2 ubuntu@18.219.217.47 "cd /opt/portfolio-support-copilot && sudo bash promote.sh '$IMAGE'"
      - name: Remove ephemeral key
        if: always()
        run: rm -f ~/.ssh/ec2
